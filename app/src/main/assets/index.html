<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الإسقاط العمودي حاج صحراوي سعيد</title>
<style>
:root{box-sizing:border-box;--bg:#f4f6fb;--card:#fff;--tx:#1b2433;--mut:#5b6678;--ac:#2563eb;--acx:#fff;--bd:#d5dbe8;--ink:#111827;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2132;--tx:#e8ecf5;--mut:#9aa6bd;--ac:#6ea0ff;--acx:#0b1220;--bd:#2c3650;--ink:#e8ecf5}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2132;--tx:#e8ecf5;--mut:#9aa6bd;--ac:#6ea0ff;--acx:#0b1220;--bd:#2c3650;--ink:#e8ecf5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:720px;margin-inline:auto;padding:10px 12px 24px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 8px}.hd img{width:72px;height:72px;object-fit:contain;border-radius:12px;background:#fff;flex:none}h1{font-size:19px;margin:0 0 2px}.sub{margin:0!important}
.sub{color:var(--mut);font-size:13px;margin:0 0 8px}
#cw{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:min(60vh,520px);min-height:320px;touch-action:none;cursor:grab}
#info{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.7}
#info b{color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;flex:1;min-width:0}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700;flex:2}
button.on{border-color:var(--ac);color:var(--ac);font-weight:700;box-shadow:inset 0 0 0 1px var(--ac)}
button:disabled{opacity:.4}
#sol button{flex:1 1 28%}
.lg{color:var(--mut);font-size:12px;line-height:1.8}
</style>
</head>

function P3(p){const x=p[0]-C[0],y=p[1]-C[1],z=p[2]-C[2],x1=x*ca+z*sa,z1=-x*sa+z*ca;
 return[cx+x1*sc,cy-(y*cb-z1*sb)*sc,y*sb+z1*cb]}
const lerp=(a,b,t)=>a+(b-a)*t;

function draw(){
 const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 if(cv.width!=Math.round(w*dpr)||cv.height!=Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#111';
 const{Xp,Yp,Zp}=S,p=(st.th+st.ph)/2,th=st.th*Math.PI/2,ph=st.ph*Math.PI/2;
 yaw=st.yaw;pit=st.pit;ca=Math.cos(yaw);sa=Math.sin(yaw);cb=Math.cos(pit);sb=Math.sin(pit);
 C=[lerp(Xp/2,(Xp+Zp)/2,p),lerp(Yp/2,(Yp-Zp)/2,p),lerp(Zp/2,0,p)];cx=w/2;cy=h/2;
 const s0=Math.min(w,h)/(Math.hypot(Xp,Yp,Zp)*1.12),s1=Math.min(w/(Xp+Zp+1.2),h/(Yp+Zp+1.6)),ang=Math.min(1,(Math.abs(yaw)+Math.abs(pit))/.8);
 sc=lerp(s0,s1*(1-.3*ang),p);
 const mH=(u,v)=>{const z=-v;return[u,-z*Math.sin(th),z*Math.cos(th)]},mP=(u,v)=>{const z=u-Xp;return[Xp+z*Math.sin(ph),v,z*Math.cos(ph)]},mV=(u,v)=>[u,v,0];
 const G=[],fs=Math.max(13,sc*.55);
 const lines=(seg,m,hid)=>{ctx.beginPath();for(const s of seg)if((s.h?1:0)==hid){const a=P3(m(...s.a)),b=P3(m(...s.b));ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke()};
 const mk=(col,ch,m,r,seg,lab)=>{const cs=[[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]];
  G.push({d:P3(m((r[0]+r[2])/2,(r[1]+r[3])/2))[2],f(){
   ctx.beginPath();cs.forEach(([u,v],i)=>{const q=P3(m(u,v));i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();
   ctx.fillStyle=`rgba(${col},.14)`;ctx.fill();ctx.strokeStyle=`rgba(${col},.9)`;ctx.lineWidth=1.6;ctx.stroke();
   if(st.va>.01){ctx.globalAlpha=st.va;ctx.strokeStyle=ink;ctx.lineCap='butt';ctx.setLineDash([6,4]);ctx.lineWidth=1.2;lines(seg,m,1);ctx.setLineDash([]);ctx.lineCap='round';ctx.lineWidth=2.2;lines(seg,m,0);ctx.globalAlpha=1}
   const q=P3(m(...lab));ctx.fillStyle=`rgb(${col})`;ctx.font=`700 ${fs}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,q[0],q[1])}})};
 mk('37,99,235','V',mV,[0,0,Xp,Yp],S.segs[0],[.6,Yp-.6]);
 mk('22,163,74','H',mH,[0,-Zp,Xp,0],S.segs[1],[.6,-Zp+.6]);
 mk('234,88,12','P',mP,[Xp,0,Xp+Zp,Yp],S.segs[2],[Xp+Zp-.6,Yp-.6]);
 G.push({d:P3([Xp/2,Yp/2,Zp/2])[2],f(){
  if(st.oa<.01)return;ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.strokeStyle=ink;
  for(const v of S.vs){const a=P3(v);
   [[[v[0],v[1],0],1],[[v[0],-v[2]*Math.sin(th),v[2]*Math.cos(th)],1-st.th],[[Xp+v[2]*Math.sin(ph),v[1],v[2]*Math.cos(ph)],1-st.ph]].forEach(([t,al])=>{
    ctx.globalAlpha=st.oa*al*.4;const b=P3(t);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()})}
  ctx.setLineDash([]);ctx.globalAlpha=st.oa;
  const L=S.F.map(f=>{const n=[0,0,0];n[f.a]=f.sg;const z=n[1]*sb+(-n[0]*sa+n[2]*ca)*cb,q=f.co.map(P3);return{f,q,z,d:(q[0][2]+q[2][2])/2}}).filter(o=>o.z>.001).sort((a,b)=>a.d-b.d);
  for(const o of L){const c=COL[o.f.a][o.f.sg>0?1:0];ctx.beginPath();o.q.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=1;ctx.stroke();
   ctx.strokeStyle='#0b1b3a';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();o.f.ek.forEach((e,i)=>{if(e){const a=o.q[i],b=o.q[(i+1)%4];ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}});ctx.stroke()}}});
 G.push({d:1e9,f(){
  if(st.ra>.02){ctx.globalAlpha=st.ra;ctx.lineWidth=1;ctx.strokeStyle='#dc2626';ctx.beginPath();
   for(const r of S.refs){const a=P3([r[0],r[1],0]),b=P3([r[2],r[3],0]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke();
   ctx.setLineDash([10,3,2,3]);ctx.lineWidth=1.4;ctx.beginPath();const a=P3([Xp,0,0]),b=P3([Xp+Zp,-Zp,0]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
   ctx.setLineDash([]);ctx.fillStyle='#dc2626';ctx.font=`700 ${fs*.8}px system-ui`;ctx.textAlign='center';ctx.fillText('45°',b[0]-fs*.8,b[1]-fs*.3)}
  if(st.la>.02){ctx.globalAlpha=st.la;ctx.fillStyle=ink;ctx.font=`600 ${Math.max(12,sc*.42)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
   [['المسقط الرأسي',Xp/2,Yp+.5],['المسقط الأفقي',Xp/2,-Zp-.5],['المسقط الجانبي',Xp+Zp/2,Yp+.5]].forEach(([t,u,v])=>{const q=P3([u,v,0]);ctx.fillText(t,q[0],q[1])})}}});
 G.sort((a,b)=>a.d-b.d).forEach(g=>{ctx.save();g.f();ctx.restore()})}

function frame(){
 const t={th:+(stage>=1),ph:+(stage>=2),oa:stage>=3?(showV?0:1):1,ra:+(stage>=3&&showV),la:+(stage>=3),va:+showV};
 for(const k in t)st[k]+=(t[k]-st[k])*.09;
 st.yaw+=(st.yT-st.yaw)*.09;st.pit+=(st.pT-st.pit)*.09;
 draw();requestAnimationFrame(frame)}

let dr=null;
cv.onpointerdown=e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr[0],dy=e.clientY-dr[1];dr=[e.clientX,e.clientY];
 st.yaw+=dx*.01;st.pit=Math.max(-1.45,Math.min(1.45,st.pit+dy*.01));st.yT=st.yaw;st.pT=st.pit};
cv.onpointerup=cv.onpointercancel=()=>dr=null;

const LAB=['فتح المستوى H','فتح المستوى P','إظهار ورقة الرسم','إعادة المجسم'];
const INF=[
'<b>الخطوة 0:</b> المجسم داخل مكعب الإسقاط بين الراصد والمستويات: <b>V</b> خلفه، <b>H</b> تحته، <b>P</b> على يمينه. اسحب لتدويره.',
'<b>الخطوة 1:</b> فُتح المستوى <b>H</b> بتدويره 90° للأسفل حول خط الأرض، فصار المسقط الأفقي <b>تحت</b> المسقط الرأسي.',
'<b>الخطوة 2:</b> فُتح المستوى <b>P</b> بتدويره 90° إلى اليمين، فصار المسقط الجانبي (من جهة اليسار) <b>على يمين</b> المسقط الرأسي.',
'<b>ورقة الرسم:</b> خطوط الإسناد الحمراء تربط المساقط، وخط 45° ينقل الأبعاد بين الأفقي والجانبي. الخط المتقطع = حافة خفية.',
'<b>وضع التدريب:</b> الورقة بلا مساقط. ارسمها بنفسك (المجسم ظاهر لتدويره)، ثم اضغط «إظهار المساقط» لتقارن بالحل.'];
function ui(){
 $('info').innerHTML=INF[stage==3&&!showV?4:stage];
 $('prev').disabled=stage==0;$('next').textContent='التالي: '+LAB[stage];
 $('tog').textContent=showV?'إخفاء المساقط (تدرّب)':'إظهار المساقط (الحل)';
 [...$('sol').children].forEach((b,i)=>b.classList.toggle('on',SOL[i]===cur))}
function go(n){const o=stage;stage=n;if(stage==3){st.yT=st.pT=0}else if(o==3){st.yT=.6;st.pT=.45}ui()}
let cur=SOL[0];
SOL.forEach(d=>{const b=document.createElement('button');b.textContent=d.n;b.onclick=()=>{cur=d;S=build(d);ui()};$('sol').appendChild(b)});
$('prev').onclick=()=>go(Math.max(0,stage-1));
$('next').onclick=()=>go(stage<3?stage+1:0);
$('tog').onclick=()=>{showV=!showV;ui()};
$('rst').onclick=()=>{if(stage<3){st.yT=.6;st.pT=.45}};
S=build(cur);ui();frame();
</script>
</body>
